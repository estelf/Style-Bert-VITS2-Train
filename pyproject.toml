[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "style-bert-vits2"
# uv_build は動的バージョン非対応のため静的指定（style_bert_vits2/constants.py の VERSION と必ず揃える）
version = "2.7.0"
description = "Style-Bert-VITS2: Bert-VITS2 with more controllable voice styles. (Japanese-only learning core)"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"  # SPDX表記（旧: AGPL-3.0）
keywords = []
authors = [
    { name = "litagin02", email = "139731664+litagin02@users.noreply.github.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "accelerate",
    "gradio>=5.0",
    "librosa",
    "loguru",
    "numba",
    "num2words",
    "numpy>=2",  # pyannote.audio 4.x が numpy>=2 を要求する。pyopenjtalk-dict はホイールが numpy 1.x ABI 前提のため [tool.uv] でソースビルドしている
    "pyannote.audio>=4.0.7",
    "pydantic>=2.0",
    "pyopenjtalk-dict",
    "pyworld-prebuilt",
    "safetensors",
    "setuptools<81",  # pyopenjtalk-dict が pkg_resources を使うため（81以降では削除された）
    "tensorboard",
    "torch>=2.4",
    "torchaudio>=2.4",
    "tqdm",
    "transformers",
]

[project.optional-dependencies]
# スタイルベクトルの可視化・クラスタリング用 (gradio_tabs/style_vectors.py)
style-vectors = [
    "matplotlib",
    "scikit-learn",
    "umap-learn",
]

[project.urls]
Documentation = "https://github.com/litagin02/Style-Bert-VITS2#readme"
Issues = "https://github.com/litagin02/Style-Bert-VITS2/issues"
Source = "https://github.com/litagin02/Style-Bert-VITS2"

[tool.uv.build-backend]
# フラットレイアウトで style_bert_vits2/ をそのままパッケージ化する（デフォルトの src/  layout ではない）
module-name = "style_bert_vits2"
module-root = ""
# ソース配布物に含める追加ファイル（コアライブラリ本体以外のリポジトリ資産。LICENSE 等はデフォルトで含まれる）
source-include = [
    ".vscode/**",
    "dict_data/default.csv",
    "docs/**",
    "tests/**",
    "LGPL_LICENSE",
    "LICENSE",
]

[tool.uv]
# torch 等は PyPI の CUDA ビルドがそのまま入る（必要なら cu12x index を使うこと）
# pyopenjtalk-dict はホイールが numpy 1.x ABI でビルドされているため、numpy 2 環境では
# ソースからビルドする（環境構築時に1回だけ発生し、cmake/cython は下のビルド制約で入る。
# cython は 3.1 以上が必要: 0.29 系で生成した C++ は Python 3.13 の C API でコンパイルできない）
no-binary-package = ["pyopenjtalk-dict"]
build-constraint-dependencies = ["cmake<4", "cython>=3.1", "setuptools<81"]

[dependency-groups]
dev = [
    "coverage[toml]>=6.5",
    "pytest",
    "scipy",
]

[tool.pytest.ini_options]
addopts = "-s"
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["style_bert_vits2", "tests"]
branch = true
parallel = true
omit = ["style_bert_vits2/constants.py"]

[tool.coverage.paths]
style_bert_vits2 = ["style_bert_vits2", "*/style-bert-vits2/style_bert_vits2"]
tests = ["tests", "*/style-bert-vits2/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
extend-select = ["I"]

[tool.ruff.lint.isort]
lines-after-imports = 2
