[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "style-bert-vits2"
# uv_build は動的バージョン非対応のため静的指定（constants.py の VERSION は importlib.metadata 経由でここを読む）
version = "2.7.0"
description = "Style-Bert-VITS2: Bert-VITS2 with more controllable voice styles. (Japanese-only learning core)"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"  # SPDX表記（旧: AGPL-3.0）
keywords = []
authors = [
    { name = "estelf", email = "raisin2468@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    # accelerate は直接 import しないが、transformers の from_pretrained(device_map=...)
    # （bert_models.load_model 経由の BERT ロード）が実行時に必須とするためコア依存のまま
    "accelerate",
    "huggingface-hub",  # style_bert_vits2/pretrained.py の事前学習モデル取得（snapshot_download）に必要
    # librosa は train/mel_processing.py の mel 変換行列のみのため、torchaudio への代替も
    # 検討の余地はあるが、フィルタバンクの数値が微妙に異なる（学習結果＝ゴールデン音声の
    # 契約が変わる）ため現状は維持。以下4つ（huggingface-hub/librosa/soundfile/tensorboard）は
    # 学習・前処理専用だが、本リポジトリは「学習コア」として `uv sync`（追加指定なし）で
    # 全て揃うことを契約とするためコア依存のまま
    "librosa",
    "loguru",
    "numba",
    "num2words",
    "numpy>=2",  # pyannote.audio 4.x（train グループ）が numpy>=2 を要求する。pyopenjtalk-plus は numpy 2.x 向け事前ビルド済み wheel が提供されるためソースビルド不要
    "pydantic>=2.0",
    "pyopenjtalk-plus[onnxruntime,tsqyomi]",  # pyopenjtalk のドロップイン代替（import pyopenjtalk のまま）。onnxruntime は「何」読み推定用、tsqyomi は同形異音語の文脈読み選択用
    "pyworld-prebuilt",
    "safetensors",
    "soundfile",  # check_dataset.py / data_utils.py の音声読み込み
    "tensorboard",  # train/pipeline.py の学習曲線
    "torch>=2.4",
    "torchaudio>=2.4",
    "tqdm",
    "transformers",
]

[project.urls]
Documentation = "https://github.com/estelf/Style-Bert-VITS2#readme"
Issues = "https://github.com/estelf/Style-Bert-VITS2/issues"
Source = "https://github.com/estelf/Style-Bert-VITS2"

[tool.uv.build-backend]
# フラットレイアウトで style_bert_vits2/ をそのままパッケージ化する（デフォルトの src/  layout ではない）
module-name = "style_bert_vits2"
module-root = ""
# ソース配布物に含める追加ファイル（コアライブラリ本体以外のリポジトリ資産。LICENSE 等はデフォルトで含まれる）
source-include = [
    "dict_data/default.csv",
    "docs/**",
    "tests/**",
    "LGPL_LICENSE",
    "LICENSE",
]

[tool.uv]
# torch 等は PyPI の CUDA ビルドがそのまま入る（必要なら cu12x index を使うこと）
# pyopenjtalk-plus は numpy 2.x 向け事前ビルド済み wheel が全プラットフォーム向けに配布されており、
# ソースビルド（cmake / cython>=3.1 制約）は不要になった
# gui / train を extras でなく dependency-groups に置き既定でインストールする。
# extras にすると `uv run` 側の自動 sync が「既定エクストラ＝無し」で環境を完全一致させるため、
# 入れたはずの gradio / pyannote.audio を黙って除去した（dependency-groups は既定対象なので対象外）
default-groups = ["dev", "gui", "train"]

[dependency-groups]
# 試聴 GUI（app.py / gradio_tabs）用。コアライブラリ・学習パイプライン自体は不要だが既定で入れる
gui = [
    "gradio>=5.0",
]
# スタイル生成（前処理 Step6、tts_model の音声からのスタイルベクトル推論）用。
# pyannote.audio は numpy>=2 を要求されるため環境に注意
train = [
    "pyannote.audio>=4.0.7",
]
dev = [
    "black",
    "coverage[toml]>=6.5",
    "pytest",
    "pyright",
    "ruff",
    "scipy",
]

[tool.pytest.ini_options]
addopts = "-s"
testpaths = ["tests"]

[tool.coverage.run]
source_pkgs = ["style_bert_vits2", "tests"]
branch = true
parallel = true
omit = ["style_bert_vits2/constants.py"]

[tool.coverage.paths]
style_bert_vits2 = ["style_bert_vits2", "*/style-bert-vits2/style_bert_vits2"]
tests = ["tests", "*/style-bert-vits2/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
# black 優先。この値を 2 にすると ruff I001 が black と正面衝突する（black は import 直後が
# 通常コードなら1空行、def/class なら2空行と文脈依存で決めるため、固定値では両立不能）。
# -1（既定）は black の出力をそのまま許容するので、ruff check と black --check が同時に通る
lines-after-imports = -1

[tool.pyright]
# requires-python と揃える（これより新しい構文を許容しない）
pythonVersion = "3.10"
typeCheckingMode = "basic"
# 型解決には gui / train グループ（gradio・pyannote.audio）が必要。既定グループに
# 含まれるので `uv sync` だけで揃う。未インストールだと reportMissingImports が落ちる。
# ※かつて extras に置いていたときは、`uv run` の自動 sync が既定エクストラ無しで
#  環境を完全一致させ、gradio / pyopenjtalk-plus を黙って除去して破損した
include = [
    "app.py",
    "gradio_tabs",
    "preprocess",
    "preprocess_all.py",
    "style_bert_vits2",
    "train",
    "train_model.py",
    "tests",
]
# 学習成果物・データセットは Python ソースではない（テストの model_assets は実行時に生成される）
exclude = ["**/__pycache__", "Data", "model_assets", "pretrained", "tests/model_assets"]

# ---- 導入時のベースライン ----
# error にしているのは「当リポジトリで直せる型問題」だけ。以下を warning にするのは、
# 実バグではなく型情報の限界が原因だと全件で確認できたため
# （error のままだとノイズに埋もれて新規の実エラーが見えなくなる）。
# 締める際は各コメントの該当箇所から順に error へ戻す。
reportAttributeAccessIssue = "warning" # 残10件（pyright 1.1.414 実測）。DDP 展開の hasattr(model,"module") 展開が型詰められない（checkpoints.py / safetensors.py の load/save 系5件）、floss=0 初期化に対する .mean()/.backward()（losses.py の WavLMLoss.forward、pipeline.py の loss_disc_all/loss_dur_disc_all の backward）、torch.hub.load の戻り値（select_best.py の load_utmos）、torch.utils.data.distributed の属性解決（data_utils.py の DistributedBucketSampler クラス定義）
reportCallIssue = "warning" # 残2件。torch スタブ起因。commons.py の initialize_weights（m.weight.data.normal_()）と models_jp_extra.py の Generator.remove_weight_norm（layer.remove_weight_norm()）が Tensor と解釈される

[[tool.pyright.executionEnvironments]]
root = "train"
# 学習パイプラインは設計上これらを必要とするため train 配下だけ緩和する。
# 判別器・writer・optimizer は機能オフ時に None のまま受け渡し、損失変数は
# フラグガードの中で条件付き定義される（pipeline.py の学習ループ）
reportPossiblyUnboundVariable = "warning"
reportOptionalMemberAccess = "warning"
reportArgumentType = "warning"
reportOperatorIssue = "warning"

[[tool.pyright.executionEnvironments]]
root = "style_bert_vits2"
# tts_model.py の style_vector_inference（未ロード時に None）と、transformers の
# from_pretrained が Optional で返るための戻り値型ノイズ。実バグではないので導入時は warning
reportOptionalMemberAccess = "warning"
reportOptionalCall = "warning"
reportReturnType = "warning"
reportAssignmentType = "warning"
